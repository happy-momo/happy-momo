<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1380" role="img" aria-label="Architecting Intelligence — a continuous warm oil painting">
  <title>Architecting Intelligence</title>
  <desc>One continuous canvas: drifting warm pigment, title, skills palette, and guiding verse, unified by a single grain and light field.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="0.55" stop-color="#08050a"/>
      <stop offset="1" stop-color="#0a0808"/>
    </linearGradient>

    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD37A"/>
      <stop offset="0.40" stop-color="#FBBF24">
        <animate attributeName="stop-color"
                 values="#FBBF24;#F59E0B;#FB7185;#FBBF24" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.72" stop-color="#FB7185">
        <animate attributeName="stop-color"
                 values="#FB7185;#F43F5E;#FBBF24;#FB7185" dur="17s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>

    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>

    <filter id="blurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix"
          values="0 0 0 0 0.95
                  0 0 0 0 0.92
                  0 0 0 0 0.88
                  0 0 0 0.05 0"/>
    </filter>

    <filter id="drag" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="20"/>
    </filter>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowD" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowE" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Continuous canvas -->
  <rect width="1200" height="1380" fill="url(#sky)"/>

  <!-- Slow pigment field drifting across the whole scroll -->
  <g filter="url(#soft)">
    <circle cx="120" cy="470" r="340" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; 46 -38; 0 0" dur="21s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="180" r="300" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; -52 -30; 16 20; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="800" r="380" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; -30 34; 40 -20; 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="1120" r="300" fill="url(#glowD)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; 36 -26; -18 30; 0 0" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="1180" r="280" fill="url(#glowE)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; -40 20; 22 -18; 0 0" dur="28s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= HERO ================= -->
  <text x="600" y="238" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="700" font-size="92" letter-spacing="2" fill="url(#paint)">
    Architecting
  </text>
  <text x="600" y="338" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="700" font-size="94" letter-spacing="1" fill="url(#paint)">
    Intelligence.
  </text>

  <g filter="url(#drag)">
    <path pathLength="1" d="M 250 402 C 470 420 700 396 952 404"
          fill="none" stroke="url(#paint)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0"
               begin="0.9s" dur="1.9s" fill="freeze" repeatCount="1"/>
    </path>
  </g>

  <text x="600" y="472" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="19"
        fill="#8CA0B8" letter-spacing="5" opacity="0">
    FUSING  PHYSICAL  INTUITION  WITH  FRONTIER  AI
    <animate attributeName="opacity" values="0;0.9" begin="2.6s" dur="1.4s" fill="freeze"/>
  </text>

  <text x="600" y="532" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic" font-size="15"
        fill="#5b6a82" letter-spacing="3" opacity="0">
    edge-native · cyber-physical
    <animate attributeName="opacity" values="0;0.7" begin="3.2s" dur="1.6s" fill="freeze"/>
  </text>

  <!-- Hero embers -->
  <g>
    <circle cx="170" cy="580" r="3" fill="#FBBF24">
      <animate attributeName="cy" values="580;120" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="580" r="2.2" fill="#FB7185">
      <animate attributeName="cy" values="580;80" begin="-3s" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" begin="-3s" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="580" r="2.6" fill="#F43F5E">
      <animate attributeName="cy" values="580;140" begin="-6s" dur="8.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" begin="-6s" dur="8.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="580" r="3.2" fill="#FBBF24">
      <animate attributeName="cy" values="580;60" begin="-2s" dur="10.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" begin="-2s" dur="10.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="580" r="2" fill="#FB7185">
      <animate attributeName="cy" values="580;180" begin="-5s" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" begin="-5s" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="580" r="2.8" fill="#F43F5E">
      <animate attributeName="cy" values="580;100" begin="-1s" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" begin="-1s" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ================= SKILLS ================= -->
  <!-- Faint connecting thread -->
  <path d="M 78 790 C 330 790 870 790 1122 790" fill="none"
        stroke="#3a2a24" stroke-width="1.5" stroke-dasharray="2 14" opacity="0.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#FDF6E3">

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -14;0 0;0 12;0 0" dur="6.6s" begin="-1.2s" repeatCount="indefinite"/>
      <circle cx="78"  cy="790" r="46"  fill="#FBBF24" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="78"  cy="790" r="22"  fill="#FBBF24" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="78"  y="798" text-anchor="middle" font-size="24">PyTorch</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -12;0 0;0 14;0 0" dur="7.4s" begin="-2.6s" repeatCount="indefinite"/>
      <circle cx="228" cy="790" r="46"  fill="#FB7185" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="228" cy="790" r="22"  fill="#FB7185" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="228" y="798" text-anchor="middle" font-size="24">LangChain</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 14;0 0;0 -12;0 0" dur="6.2s" begin="-0.8s" repeatCount="indefinite"/>
      <circle cx="378" cy="790" r="46"  fill="#A855F7" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="378" cy="790" r="22"  fill="#A855F7" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="378" y="798" text-anchor="middle" font-size="24">Graph RAG</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -13;0 0;0 12;0 0" dur="7.0s" begin="-3.4s" repeatCount="indefinite"/>
      <circle cx="528" cy="790" r="46"  fill="#EA580C" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="528" cy="790" r="22"  fill="#EA580C" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="528" y="798" text-anchor="middle" font-size="24">Edge AI</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 13;0 0;0 -12;0 0" dur="6.8s" begin="-1.7s" repeatCount="indefinite"/>
      <circle cx="678" cy="790" r="46"  fill="#F43F5E" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="678" cy="790" r="22"  fill="#F43F5E" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="678" y="798" text-anchor="middle" font-size="24">NLP</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -12;0 0;0 13;0 0" dur="7.6s" begin="-4.2s" repeatCount="indefinite"/>
      <circle cx="828" cy="790" r="46"  fill="#F59E0B" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="828" cy="790" r="22"  fill="#F59E0B" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="828" y="798" text-anchor="middle" font-size="24">Go</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 13;0 0;0 -12;0 0" dur="6.4s" begin="-2.9s" repeatCount="indefinite"/>
      <circle cx="978" cy="790" r="46"  fill="#DC2626" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="978" cy="790" r="22"  fill="#DC2626" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="978" y="798" text-anchor="middle" font-size="24">FastAPI</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -14;0 0;0 12;0 0" dur="7.2s" begin="-5s" repeatCount="indefinite"/>
      <circle cx="1128" cy="790" r="46" fill="#9D174D" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="1128" cy="790" r="22" fill="#9D174D" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="1128" y="798" text-anchor="middle" font-size="24">MQTT</text>
    </g>

  </g>

  <text x="600" y="892" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="17" fill="#8b6a58" letter-spacing="4" opacity="0.9">
    H U M A N   x   M A C H I N E   x   S T E E L
  </text>

  <!-- ================= QUOTE ================= -->
  <circle r="420" fill="url(#glowE)">
    <animate attributeName="cx" values="560;620;560" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="1180;1230;1180" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="1150" r="60" fill="#FBBF24" opacity="0.10" filter="url(#blurSm)">
    <animate attributeName="opacity" values="0.06;0.22;0.06" dur="14s" repeatCount="indefinite"/>
  </circle>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F59E0B"/>
    <stop offset="0.5" stop-color="#FBBF24">
      <animate attributeName="stop-color"
               values="#FBBF24;#F59E0B;#FB7185;#FBBF24" dur="13s" repeatCount="indefinite"/>
    </stop>
    <stop offset="1" stop-color="#FB7185">
      <animate attributeName="stop-color"
               values="#FB7185;#FBBF24;#F59E0B;#FB7185" dur="11s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>

  <g fill="#FFF7ED" font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="1">
    <animate attributeName="opacity" values="0.96;1;0.96" dur="7s" repeatCount="indefinite"/>

    <text x="600" y="1126" text-anchor="middle" font-size="40" letter-spacing="1">
      “The future belongs to those who comprehend
    </text>
    <text x="600" y="1182" text-anchor="middle" font-size="40" letter-spacing="1">
      the weight of steel as fluently as
    </text>
    <text x="600" y="1238" text-anchor="middle" font-size="40" letter-spacing="1">
      the weights of an attention head.”
    </text>

    <text x="600" y="1292" text-anchor="middle" font-family="'Courier New', monospace"
          font-style="normal" font-size="15" letter-spacing="5" fill="#B48A6D" opacity="0.85">
      —  V I B E   C O D I N G   N A T I V E  —
    </text>
  </g>

  <g filter="url(#drag)">
    <path pathLength="1" d="M 300 1252 C 520 1262 700 1250 900 1255"
          fill="none" stroke="url(#gold)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="0" opacity="0.85">
      <animate attributeName="opacity" values="0.75;0.95;0.75" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Quote embers -->
  <g>
    <circle cx="240" cy="1380" r="2.2" fill="#FBBF24">
      <animate attributeName="cy" values="1380;1260" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="1380" r="2.0" fill="#FB7185">
      <animate attributeName="cy" values="1380;1250" begin="-3s" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" begin="-3s" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="1380" r="2.4" fill="#F43F5E">
      <animate attributeName="cy" values="1380;1280" begin="-5s" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" begin="-5s" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="1380" r="2.1" fill="#FBBF24">
      <animate attributeName="cy" values="1380;1240" begin="-1.5s" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" begin="-1.5s" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Unified canvas grain -->
  <rect width="1200" height="1380" filter="url(#grain)" opacity="0.5"/>
</svg>