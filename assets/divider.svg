<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 90" role="img" aria-label="Ink Trail divider">
  <title>Ink Trail</title>
  <desc>A single warm brush stroke driving across the canvas as a section divider.</desc>

  <defs>
    <filter id="grain" x="0" y="0" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5"/>
      <feColorMatrix type="matrix"
          values="0 0 0 0 0.95
                  0 0 0 0 0.92
                  0 0 0 0 0.88
                  0 0 0 0.04 0"/>
    </filter>
    <filter id="drag" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="16"/>
    </filter>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B">
        <animate attributeName="stop-color" values="#F59E0B;#FBBF24;#FB7185;#F59E0B" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#FB7185">
        <animate attributeName="stop-color" values="#FB7185;#FBBF24;#F59E0B;#FB7185" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <rect width="1200" height="90" fill="#0a0c12"/>

  <g filter="url(#drag)" opacity="0.85">
    <path d="M 200 46 C 480 54 720 40 1000 50"
          fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-width" values="4;5.5;4" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect width="1200" height="90" filter="url(#grain)" opacity="0.4"/>
</svg>