<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Architecting Intelligence — a warm oil painting banner">
  <title>Architecting Intelligence</title>
  <desc>Animated warm oil-painting banner: drifting amber and rose pigment, brushed serif title, a self-drawing paint stroke and rising embers.</desc>

  <defs>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD37A"/>
      <stop offset="0.40" stop-color="#FBBF24">
        <animate attributeName="stop-color"
                 values="#FBBF24;#F59E0B;#FB7185;#FBBF24" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.72" stop-color="#FB7185">
        <animate attributeName="stop-color"
                 values="#FB7185;#F43F5E;#FBBF24;#FB7185" dur="17s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#9F1239"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>

    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11"/>
      <feColorMatrix type="matrix"
          values="0 0 0 0 0.95
                  0 0 0 0 0.92
                  0 0 0 0 0.88
                  0 0 0 0.05 0"/>
    </filter>

    <filter id="drag" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="20"/>
    </filter>

    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FB7185" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#04050a" stop-opacity="0.92"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="560" fill="#05060a"/>

  <g filter="url(#soft)">
    <circle cx="120" cy="470" r="330" fill="url(#glowA)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; 46 -38; 0 0" dur="21s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1090" cy="80" r="300" fill="url(#glowB)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; -52 -30; 16 20; 0 0" dur="26s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="320" r="360" fill="url(#glowC)">
      <animateTransform attributeName="transform" type="translate"
          values="0 0; -30 34; 40 -20; 0 0" dur="30s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="560" fill="url(#glowV)"/>

  <text x="600" y="238" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="700" font-size="92" letter-spacing="2" fill="url(#paint)">
    Architecting
  </text>
  <text x="600" y="338" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-weight="700" font-size="94" letter-spacing="1" fill="url(#paint)">
    Intelligence.
  </text>

  <g filter="url(#drag)">
    <path pathLength="1" d="M 250 402 C 470 420 700 396 952 404"
          fill="none" stroke="url(#paint)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;0"
               begin="0.9s" dur="1.9s" fill="freeze" repeatCount="1"/>
    </path>
  </g>

  <text x="600" y="472" text-anchor="middle"
        font-family="'Courier New', monospace" font-size="19"
        fill="#8CA0B8" letter-spacing="5" opacity="0">
    FUSING  PHYSICAL  INTUITION  WITH  FRONTIER  AI
    <animate attributeName="opacity" values="0;0.9" begin="2.6s" dur="1.4s" fill="freeze"/>
  </text>

  <g>
    <circle cx="170" cy="580" r="3" fill="#FBBF24">
      <animate attributeName="cy" values="580;120" dur="9.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="580" r="2.2" fill="#FB7185">
      <animate attributeName="cy" values="580;80" begin="-3s" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" begin="-3s" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="580" r="2.6" fill="#F43F5E">
      <animate attributeName="cy" values="580;140" begin="-6s" dur="8.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.75;0" begin="-6s" dur="8.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="580" r="3.2" fill="#FBBF24">
      <animate attributeName="cy" values="580;60" begin="-2s" dur="10.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" begin="-2s" dur="10.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="580" r="2" fill="#FB7185">
      <animate attributeName="cy" values="580;180" begin="-5s" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" begin="-5s" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="580" r="2.8" fill="#F43F5E">
      <animate attributeName="cy" values="580;100" begin="-1s" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" begin="-1s" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="532" text-anchor="middle"
        font-family="Georgia, serif" font-style="italic" font-size="15"
        fill="#5b6a82" letter-spacing="3" opacity="0">
    edge-native · cyber-physical
    <animate attributeName="opacity" values="0;0.7" begin="3.2s" dur="1.6s" fill="freeze"/>
  </text>

  <rect width="1200" height="560" filter="url(#grain)" opacity="0.55"/>
</svg>