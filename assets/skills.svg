<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="Floating Palette — the warm technical colour field">
  <title>Floating Palette</title>
  <desc>Eight skills floating as warm pigment swatches above a fine connecting thread, gently bobbing like paint suspended in oil.</desc>

  <defs>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blurLg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="grain" x="0" y="0" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix"
          values="0 0 0 0 0.95
                  0 0 0 0 0.92
                  0 0 0 0 0.88
                  0 0 0 0.05 0"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0a0c12"/>

  <!-- Warm studio light -->
  <circle cx="100" cy="40" r="220" fill="#F59E0B" opacity="0.06" filter="url(#blurLg)"/>
  <circle cx="1140" cy="280" r="240" fill="#FB7185" opacity="0.05" filter="url(#blurLg)"/>

  <!-- Whisper of existing thread -->
  <path d="M 78 150 C 330 150 870 150 1122 150" fill="none"
        stroke="#2b3240" stroke-width="1.6" stroke-dasharray="2 14" opacity="0.55"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#FDF6E3">

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -14;0 0;0 12;0 0" dur="6.6s" begin="-1.2s" repeatCount="indefinite"/>
      <circle cx="78"  cy="150" r="46"  fill="#FBBF24" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="78"  cy="150" r="22"  fill="#FBBF24" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="78"  y="158" text-anchor="middle" font-size="24">PyTorch</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -12;0 0;0 14;0 0" dur="7.4s" begin="-2.6s" repeatCount="indefinite"/>
      <circle cx="228" cy="150" r="46"  fill="#FB7185" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="228" cy="150" r="22"  fill="#FB7185" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="228" y="158" text-anchor="middle" font-size="24">LangChain</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 14;0 0;0 -12;0 0" dur="6.2s" begin="-0.8s" repeatCount="indefinite"/>
      <circle cx="378" cy="150" r="46"  fill="#A855F7" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="378" cy="150" r="22"  fill="#A855F7" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="378" y="158" text-anchor="middle" font-size="24">Graph RAG</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -13;0 0;0 12;0 0" dur="7.0s" begin="-3.4s" repeatCount="indefinite"/>
      <circle cx="528" cy="150" r="46"  fill="#EA580C" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="528" cy="150" r="22"  fill="#EA580C" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="528" y="158" text-anchor="middle" font-size="24">Edge AI</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 13;0 0;0 -12;0 0" dur="6.8s" begin="-1.7s" repeatCount="indefinite"/>
      <circle cx="678" cy="150" r="46"  fill="#F43F5E" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="678" cy="150" r="22"  fill="#F43F5E" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="678" y="158" text-anchor="middle" font-size="24">NLP</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -12;0 0;0 13;0 0" dur="7.6s" begin="-4.2s" repeatCount="indefinite"/>
      <circle cx="828" cy="150" r="46"  fill="#F59E0B" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="828" cy="150" r="22"  fill="#F59E0B" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="828" y="158" text-anchor="middle" font-size="24">Go</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 13;0 0;0 -12;0 0" dur="6.4s" begin="-2.9s" repeatCount="indefinite"/>
      <circle cx="978" cy="150" r="46"  fill="#DC2626" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="978" cy="150" r="22"  fill="#DC2626" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="978" y="158" text-anchor="middle" font-size="24">FastAPI</text>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate"
          values="0 0;0 -14;0 0;0 12;0 0" dur="7.2s" begin="-5s" repeatCount="indefinite"/>
      <circle cx="1128" cy="150" r="46" fill="#9D174D" opacity="0.20" filter="url(#blurLg)"/>
      <circle cx="1128" cy="150" r="22" fill="#9D174D" opacity="0.80"  filter="url(#blurSm)"/>
      <text x="1128" y="158" text-anchor="middle" font-size="24">MQTT</text>
    </g>

  </g>

  <!-- A thin, honest signature beneath the palette -->
  <text x="600" y="252" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-style="italic"
        font-size="17" fill="#8b6a58" letter-spacing="4" opacity="0.9">
    H U M A N   x   M A C H I N E   x   S T E E L
  </text>

  <rect width="1200" height="300" filter="url(#grain)" opacity="0.45"/>
</svg>