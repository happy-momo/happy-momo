<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="Weight of Steel — the guiding principle">
  <title>Weight of Steel</title>
  <desc>An oil-painting verse: the weight of steel versus the weights of an attention head, revealed slowly with a painted underline.</desc>

  <defs>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="blurSm" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="grain" x="0" y="0" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="8"/>
      <feColorMatrix type="matrix"
          values="0 0 0 0 0.95
                  0 0 0 0 0.92
                  0 0 0 0 0.88
                  0 0 0 0.045 0"/>
    </filter>
    <filter id="drag" x="-20%" y="-60%" width="140%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="12"/>
      <feDisplacementMap in="SourceGraphic" scale="18"/>
    </filter>

    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.5" stop-color="#FBBF24">
        <animate attributeName="stop-color"
                 values="#FBBF24;#F59E0B;#FB7185;#FBBF24" dur="13s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#FB7185">
        <animate attributeName="stop-color"
                 values="#FB7185;#FBBF24;#F59E0B;#FB7185" dur="11s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0a0c12" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="360" fill="#0a0c12"/>

  <!-- Warm light bleeding up from the machinery below, breathing -->
  <circle r="420" fill="url(#halo)">
    <animate attributeName="cx" values="560;620;560" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="280;330;280" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="150" r="60" fill="#FBBF24" opacity="0.10" filter="url(#blurSm)">
    <animate attributeName="opacity" values="0.06;0.22;0.06" dur="14s" repeatCount="indefinite"/>
  </circle>

  <!-- The verse, always legible, softly breathing -->
  <g fill="#FFF7ED" font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="1">
    <animate attributeName="opacity" values="0.96;1;0.96" dur="7s" repeatCount="indefinite"/>

    <text x="600" y="126" text-anchor="middle" font-size="40" letter-spacing="1">
      “The future belongs to those who comprehend
    </text>
    <text x="600" y="182" text-anchor="middle" font-size="40" letter-spacing="1">
      the weight of steel as fluently as
    </text>
    <text x="600" y="238" text-anchor="middle" font-size="40" letter-spacing="1">
      the weights of an attention head.”
    </text>

    <text x="600" y="292" text-anchor="middle" font-family="'Courier New', monospace"
          font-style="normal" font-size="15" letter-spacing="5" fill="#B48A6D" opacity="0.85">
      —  V I B E   C O D I N G   N A T I V E  —
    </text>
  </g>

  <!-- The painted underline, visible, softly shimmering -->
  <g filter="url(#drag)">
    <path pathLength="1" d="M 300 252 C 520 262 700 250 900 255"
          fill="none" stroke="url(#gold)" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="0" opacity="0.85">
      <animate attributeName="opacity" values="0.75;0.95;0.75" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Faint rising embers along the bottom edge -->
  <g>
    <circle cx="240" cy="360" r="2.2" fill="#FBBF24">
      <animate attributeName="cy" values="360;240" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="360" r="2.0" fill="#FB7185">
      <animate attributeName="cy" values="360;230" begin="-3s" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0" begin="-3s" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="360" r="2.4" fill="#F43F5E">
      <animate attributeName="cy" values="360;260" begin="-5s" dur="8.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" begin="-5s" dur="8.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="360" r="2.1" fill="#FBBF24">
      <animate attributeName="cy" values="360;220" begin="-1.5s" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" begin="-1.5s" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect width="1200" height="360" filter="url(#grain)" opacity="0.4"/>
</svg>