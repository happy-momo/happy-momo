name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        with:
          github_user_name: happy-momo
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FBBF24&color_dots=%230D1117,%23F59E0B,%23FB7185,%23F43F5E,%239F1239
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dist/
          git commit -m "generated contribution snake" || true
          git push