name: snapshot-stats

on:
  # refresh stats every 2 hours
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  # also refresh immediately on push so the snapshots always exist
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub's ubuntu runners (US/Virginia) can normally reach the stat
      # services, so we snapshot their SVGs into the repo. The README then
      # serves them via cdn.jsdelivr.net, which is reachable from networks
      # where vercel.app / raw.githubusercontent are blocked.
      - name: Snapshot stats SVGs
        shell: bash
        run: |
          set +e
          mkdir -p dist

          fetch() {
            local url="$1" out="$2"
            echo "== fetching: $out  <=  $url"
            local tmp="dist/${out}.tmp"
            curl -sSL --max-time 40 --retry 2 \
              -w "curl: HTTP %{http_code} size=%{size_download} exit=%{errormsg}\n" \
              "$url" -o "$tmp" 2> /tmp/curlerr.txt
            local code=$?
            echo "curl exit code = $code"
            if [ $code -ne 0 ]; then
              echo "--- curl stderr ---"; cat /tmp/curlerr.txt; echo "--- end stderr ---"
            fi
            if [ $code -ne 0 ] || [ ! -s "$tmp" ]; then
              echo "!! FAILED to fetch $out"
              echo "diag for $out:" >> dist/DIAG.txt
              echo "curl exit $code" >> dist/DIAG.txt
              cat /tmp/curlerr.txt >> dist/DIAG.txt
              echo "$url" >> dist/DIAG.txt
              echo "---" >> dist/DIAG.txt
              rm -f "$tmp"
              return 1
            fi
            head -c 120 "$tmp" | grep -qE '<svg|<\?xml' || {
              echo "!! $out not a valid SVG; first bytes:"; head -c 300 "$tmp"
              echo "diag for $out:" >> dist/DIAG.txt
              echo "non-SVG response" >> dist/DIAG.txt
              head -c 300 "$tmp" >> dist/DIAG.txt
              echo "---" >> dist/DIAG.txt
              rm -f "$tmp"; return 1;
            }
            mv "$tmp" "dist/${out}"
            echo "OK   $out -> $(wc -c < dist/${out}) bytes"
          }

          fetch \
            "https://github-readme-stats.vercel.app/api?username=happy-momo&show_icons=true&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&icon_color=E8D4AA&border_color=8A6A2A&hide_border=false&count_private=true" \
            "github-stats.svg"
          fetch \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=happy-momo&layout=compact&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&border_color=8A6A2A&hide_border=false&langs_count=8" \
            "top-langs.svg"

          echo "== dist contents:"
          ls -la dist/
          # Never fail here: we want DIAG.txt committed to inspect later.
          # The Commit step decides whether anything succeeded.
          [ -f dist/github-stats.svg ] || [ -f dist/top-langs.svg ] || \
            { echo "FATAL: no snapshots produced (diagnostics in dist/DIAG.txt)"; }

      - name: Commit snapshots
        shell: bash
        run: |
          set +e
          echo "== git diff --stat (before):"
          git status --porcelain

          # Mirrored token push so the bot's own commit does not retrigger pushes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "no changes to commit; done"
          else
            git commit -m "chore(stats): refresh stat snapshot SVGs"
            echo "== pushing..."
            git push origin HEAD:main
            echo "== push exit: $?"
          fi