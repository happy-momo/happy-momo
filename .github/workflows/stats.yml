name: snapshot-stats

on:
  # refresh stats every 2 hours
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  # also refresh immediately on push so the snapshots always exist
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Probe candidate instances (runner is on a US vantage point),
      # report which ones actually return a real SVG right now.
      - name: Probe candidate instances from runner
        shell: bash
        run: |
          set +e
          rm -f dist/DIAG.txt
          probe() {
            local url="$1" tag="$2"
            local tmp="dist/probe_${tag}.tmp"
            code=$(curl -sSL --max-time 25 -w "%{http_code}" "$url" -o "$tmp" 2>/dev/null)
            if [ "$code" = "200" ] && head -c 60 "$tmp" | grep -qE '<svg|<\?xml'; then
              echo "ALIVE  $tag  HTTP $code  $(wc -c < "$tmp")B  $url" | tee -a dist/DIAG.txt
            else
              first=$(head -c 200 "$tmp" | tr -d '\n')
              echo "DOWN   $tag  HTTP $code  $url" | tee -a dist/DIAG.txt
              echo "       body: ${first:0:120}" | tee -a dist/DIAG.txt
            fi
            rm -f "$tmp"
          }

          probe "https://github-readme-stats.vercel.app/api?username=happy-momo" official
          probe "https://github-readme-stats-git-fork.vercel.app/api?username=happy-momo" fork-vercel
          probe "https://github-readme-stats.anuraghazra.dev/api?username=happy-momo" anuraghazra-dev
          probe "https://github-readme-stats-cv.vercel.app/api?username=happy-momo" cv
          probe "https://ght-opencommunity.vercel.app/api?username=happy-momo" opencommunity
          probe "https://streak-stats.demolab.com/?user=happy-momo" streak-demo

          echo "==== RESUMEN ===="
          cat dist/DIAG.txt

      - name: Commit snapshots
        shell: bash
        run: |
          set +e
          echo "== git diff --stat (before):"
          git status --porcelain

          # Mirrored token push so the bot's own commit does not retrigger pushes.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "no changes to commit; done"
          else
            git commit -m "chore(stats): refresh stat snapshot SVGs"
            echo "== pushing..."
            git push origin HEAD:main
            echo "== push exit: $?"
          fi