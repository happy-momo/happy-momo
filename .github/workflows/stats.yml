name: snapshot-stats

on:
  # refresh stats every 2 hours
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  # also refresh immediately on push so the snapshots always exist
  push:
    branches:
      - main

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Keeps two SVG stat cards fresh in dist/. The README serves them via
      # cdn.jsdelivr.net so they load even where vercel.app is blocked.
      #
      # As of Nov 2026 every public github-readme-stats instance (official
      # vercel.app and the community forks) is down (DEPLOYMENT_PAUSED).
      # This workflow auto-probes; the moment a candidate returns a real SVG
      # again it snapshots it. Until then it commits nothing, so the README
      # simply shows no card (and no stale/broken placeholder is served).
      - name: Snapshot stats SVGs (probe until a live instance returns)
        shell: bash
        run: |
          set +e
          mkdir -p dist

          fetch() {
            local out="$1" url="$2"
            local tmp="dist/${out}.tmp"
            local code
            code=$(curl -sSL --max-time 30 --retry 2 \
              -w "%{http_code}" "$url" -o "$tmp" 2>/dev/null)
            ok=0
            if [ "$code" = "200" ]; then
              head -c 300 "$tmp" | grep -qiE '(<svg|<\\?xml)' && head -c 300 "$tmp" | grep -qi 'alt=' && ok=1
            fi
            if [ "$ok" != "1" ]; then
              echo "skip ${out}: instance not serving a real stats SVG (HTTP ${code})"
              rm -f "$tmp"
              return 1
            fi
            # only keep the file if it is a genuine generated card
            mv "$tmp" "dist/${out}"
            echo "snapshotted ${out} from ${url} ($(wc -c < "dist/${out}")B)"
          }

          # candidate stats-card instances, newest/self-hosted first
          fetch github-stats.svg \
            "https://github-readme-stats.vercel.app/api?username=happy-momo&show_icons=true&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&icon_color=E8D4AA&border_color=8A6A2A&hide_border=false&count_private=true"
          fetch github-stats.svg \
            "https://github-readme-stats-git-fork.vercel.app/api?username=happy-momo&show_icons=true&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&icon_color=E8D4AA&border_color=8A6A2A&hide_border=false&count_private=true"
          fetch github-stats.svg \
            "https://github-readme-stats.anuraghazra.dev/api?username=happy-momo&show_icons=true&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&icon_color=E8D4AA&border_color=8A6A2A&hide_border=false&count_private=true"

          fetch top-langs.svg \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=happy-momo&layout=compact&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&border_color=8A6A2A&hide_border=false&langs_count=8"
          fetch top-langs.svg \
            "https://github-readme-stats-git-fork.vercel.app/api/top-langs/?username=happy-momo&layout=compact&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&border_color=8A6A2A&hide_border=false&langs_count=8"
          fetch top-langs.svg \
            "https://github-readme-stats.anuraghazra.dev/api/top-langs/?username=happy-momo&layout=compact&bg_color=0D0B08&title_color=E8D4AA&text_color=B8922A&border_color=8A6A2A&hide_border=false&langs_count=8"

          echo "== dist/ :"
          ls -la dist/

      - name: Commit snapshots
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist/
          if git diff --cached --quiet; then
            echo "no snapshot changes to commit; done"
          else
            git commit -m "chore(stats): refresh stat snapshot SVGs"
            git push origin HEAD:main
          fi